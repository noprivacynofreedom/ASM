<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Test Suite // Kanban</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{
  color-scheme:dark;
  --bg:#0e0b16;
  --surface:#161222;
  --surface-raised:#1f1a2e;
  --surface-hover:#27213a;
  --line:rgba(167,139,250,.20);
  --line-strong:rgba(167,139,250,.42);
  --accent:#a77bff;
  --accent-strong:#8b5cf6;
  --cyan:#67e8f9;
  --text:#ece8f5;
  --muted:#a39bb5;
  --ok:#3fcf8e;
  --warn:#f5b041;
  --bad:#ff5c6c;
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
  --sans:Inter,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --radius:10px;
}
html[data-theme="dedsec"]{
  --bg:#08080e;
  --surface:#10101a;
  --surface-raised:#171726;
  --surface-hover:#1f1f33;
  --line:rgba(103,232,249,.20);
  --line-strong:rgba(103,232,249,.44);
  --accent:#c084fc;
  --accent-strong:#a855f7;
  --cyan:#22d3ee;
  --text:#eef2ff;
  --muted:#94a3b8;
  --ok:#34d399;
  --warn:#fbbf24;
  --bad:#fb7185;
}
*{box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:var(--accent-strong) var(--bg)}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:var(--bg)}
*::-webkit-scrollbar-thumb{background:var(--accent-strong);border:2px solid var(--bg);border-radius:10px}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

.shell{
  display:flex;
  flex-direction:column;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 12% 0%, rgba(167,123,255,.11), transparent 42%),
    radial-gradient(ellipse at 88% 0%, rgba(103,232,249,.07), transparent 36%),
    var(--bg);
}

.topbar{
  flex:0 0 auto;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:10px 16px;
  padding:12px 18px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.brand h1{margin:0;font:700 14px var(--mono);letter-spacing:1.2px;text-transform:uppercase}
.brand .sub{font:11px var(--mono);color:var(--muted)}
.summary-pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{
  font:11px var(--mono);
  padding:3px 8px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--surface-raised);
  color:var(--muted);
}
.pill b{color:var(--text)}
.pill.ok b{color:var(--ok)}
.pill.warn b{color:var(--warn)}
.pill.bad b{color:var(--bad)}
.pill.cyan b{color:var(--cyan)}

.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{
  background:var(--surface-raised);
  border:1px solid var(--line);
  border-radius:6px;
  padding:6px 11px;
  font:600 11px var(--mono);
  letter-spacing:.5px;
  color:var(--text);
  transition:border-color .15s ease,transform .15s ease,background .15s ease;
}
.btn:hover{border-color:var(--accent);background:var(--surface-hover)}
.btn:active{transform:translateY(1px)}
.btn.primary{border-color:var(--accent);color:var(--cyan)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 7px;font-size:10px}

.main-area{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  overflow:hidden;
  position:relative;
}

.board{
  flex:1 1 auto;
  min-width:0;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(4,minmax(250px,1fr));
  gap:12px;
  padding:14px 18px;
  overflow-x:auto;
  overflow-y:hidden;
}

.col{
  display:flex;
  flex-direction:column;
  min-height:0;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
}
.col-head{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  background:var(--surface-raised);
  font:700 12px var(--mono);
  letter-spacing:.9px;
  text-transform:uppercase;
}
.col[data-status="queued"] .col-head{border-top:3px solid var(--muted)}
.col[data-status="testing"] .col-head{border-top:3px solid var(--warn)}
.col[data-status="passed"] .col-head{border-top:3px solid var(--ok)}
.col[data-status="failed"] .col-head{border-top:3px solid var(--bad)}
.col-count{
  font:600 11px var(--mono);
  padding:1px 7px;
  border-radius:999px;
  border:1px solid var(--line);
  color:var(--cyan);
}
.col-body{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.empty-col{
  padding:18px 12px;
  text-align:center;
  font:12px var(--mono);
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:8px;
}

.card{
  background:var(--surface-raised);
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 11px;
  display:flex;
  flex-direction:column;
  gap:8px;
  transition:border-color .15s ease,transform .15s ease;
}
.card:hover{border-color:var(--line-strong)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-title{margin:0;font:600 13px/1.35 var(--sans);color:var(--text);word-break:break-word}
.card-id{font:10px var(--mono);color:var(--muted)}
.card-desc{margin:0;font-size:12px;color:var(--muted);white-space:pre-wrap;word-break:break-word}

.card-controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
}
.status-select{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:5px;
  padding:3px 6px;
  font:11px var(--mono);
  color:var(--text);
}

.ticks{display:flex;flex-direction:column;gap:4px}
.tick-item{
  display:flex;
  align-items:flex-start;
  gap:7px;
  padding:4px 6px;
  border-radius:5px;
  background:rgba(0,0,0,.16);
  font-size:12px;
  cursor:pointer;
}
.tick-item:hover{background:var(--surface-hover)}
.tick-item input[type="checkbox"]{
  margin:2px 0 0;
  accent-color:var(--cyan);
  width:14px;
  height:14px;
  flex:0 0 auto;
}
.tick-item.done span{text-decoration:line-through;color:var(--muted)}

.inline-add{display:flex;gap:5px}
.inline-add input{
  flex:1 1 auto;
  min-width:0;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:5px;
  padding:4px 7px;
  font-size:11px;
}

.fb-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  padding-top:4px;
  border-top:1px solid var(--line);
}
.fb-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font:10px var(--mono);
  padding:2px 7px;
  border-radius:999px;
  border:1px solid var(--line);
  color:var(--cyan);
  background:rgba(103,232,249,.06);
}
.fb-list{
  margin:0;
  padding:6px 8px;
  list-style:none;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:6px;
  display:flex;
  flex-direction:column;
  gap:6px;
  max-height:140px;
  overflow-y:auto;
  font-size:11px;
}
.fb-list li{border-left:2px solid var(--accent);padding-left:6px}
.fb-meta{font:10px var(--mono);color:var(--muted)}

/* Launch & Run History Drawer */
.drawer{
  flex:0 0 360px;
  width:360px;
  max-width:90vw;
  min-height:0;
  background:var(--surface);
  border-left:1px solid var(--line);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.drawer[hidden]{display:none}
.drawer-head{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 14px;
  border-bottom:1px solid var(--line);
  background:var(--surface-raised);
  font:700 12px var(--mono);
  letter-spacing:.8px;
  text-transform:uppercase;
}
.drawer-body{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.run-card{
  background:var(--surface-raised);
  border:1px solid var(--line);
  border-radius:8px;
  padding:9px 10px;
  display:flex;
  flex-direction:column;
  gap:5px;
}
.run-top{display:flex;align-items:center;justify-content:space-between;gap:6px;font:11px var(--mono)}
.run-kind{
  padding:1px 6px;
  border-radius:4px;
  border:1px solid var(--line);
  font-size:10px;
  text-transform:uppercase;
}
.run-kind.launch{border-color:var(--cyan);color:var(--cyan)}
.run-kind.test_pass{border-color:var(--ok);color:var(--ok)}
.run-summary{font-size:12px;color:var(--text)}
.run-time{font:10px var(--mono);color:var(--muted)}
.run-ff{margin:4px 0 0;padding-left:14px;font:11px var(--mono);color:var(--muted)}

dialog{
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--line-strong);
  border-radius:var(--radius);
  padding:16px;
  width:min(460px,92vw);
  max-height:86vh;
  overflow:auto;
}
dialog::backdrop{background:rgba(5,4,10,.72)}
dialog h2{margin:0 0 12px;font:700 14px var(--mono);letter-spacing:.8px;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font:11px var(--mono);color:var(--muted)}
.field input,.field textarea,.field select{
  background:var(--surface-raised);
  border:1px solid var(--line);
  border-radius:6px;
  padding:7px 9px;
  color:var(--text);
}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}

@media (max-width:760px){
  .drawer{position:absolute;right:0;top:0;bottom:0;z-index:20;box-shadow:-8px 0 24px rgba(0,0,0,.55)}
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <div>
        <h1>Atlas Test Suite</h1>
        <div class="sub" id="statusLine">Loading suite…</div>
      </div>
    </div>
    <div class="summary-pills" id="summaryPills"></div>
    <div class="actions">
      <button type="button" class="btn primary" id="addFeatureBtn">+ Add Feature</button>
      <button type="button" class="btn" id="logRunBtn">+ Log Run</button>
      <button type="button" class="btn" id="drawerToggleBtn" aria-expanded="false">Run History</button>
      <button type="button" class="btn" id="themeBtn" title="Toggle Optik Dark / DedSec Dark">Theme</button>
      <button type="button" class="btn" id="refreshBtn">Refresh</button>
    </div>
  </header>

  <div class="main-area">
    <main class="board" id="board" aria-label="Test suite Kanban board">
      <section class="col" data-status="queued">
        <div class="col-head"><span>Queued</span><span class="col-count" id="count-queued">0</span></div>
        <div class="col-body" id="col-queued"></div>
      </section>
      <section class="col" data-status="testing">
        <div class="col-head"><span>Testing</span><span class="col-count" id="count-testing">0</span></div>
        <div class="col-body" id="col-testing"></div>
      </section>
      <section class="col" data-status="passed">
        <div class="col-head"><span>Passed</span><span class="col-count" id="count-passed">0</span></div>
        <div class="col-body" id="col-passed"></div>
      </section>
      <section class="col" data-status="failed">
        <div class="col-head"><span>Needs Fix</span><span class="col-count" id="count-failed">0</span></div>
        <div class="col-body" id="col-failed"></div>
      </section>
    </main>

    <aside class="drawer" id="runDrawer" hidden aria-label="Launch and run history">
      <div class="drawer-head">
        <span>Launch &amp; Run History</span>
        <button type="button" class="btn sm" id="drawerCloseBtn">Close</button>
      </div>
      <div class="drawer-body" id="runList"></div>
    </aside>
  </div>
</div>

<dialog id="addDlg">
  <form method="dialog" id="addForm">
    <h2>Add Test Feature</h2>
    <div class="field">
      <label for="featTitle">Feature Title</label>
      <input id="featTitle" required placeholder="e.g. Streaming SSE tool approval gate">
    </div>
    <div class="field">
      <label for="featDesc">Description</label>
      <textarea id="featDesc" rows="2" placeholder="What to verify and expected behavior"></textarea>
    </div>
    <div class="field">
      <label for="featStatus">Initial Column</label>
      <select id="featStatus">
        <option value="queued">Queued</option>
        <option value="testing">Testing</option>
        <option value="passed">Passed</option>
        <option value="failed">Needs Fix</option>
      </select>
    </div>
    <div class="field">
      <label for="featTicks">Checklist Tickboxes (one per line)</label>
      <textarea id="featTicks" rows="4" placeholder="Verify read tool runs without prompt&#10;Verify write tool prompts for approval"></textarea>
    </div>
    <div class="dlg-actions">
      <button type="button" class="btn" id="addCancel">Cancel</button>
      <button type="submit" class="btn primary">Create Feature</button>
    </div>
  </form>
</dialog>

<dialog id="runDlg">
  <form method="dialog" id="runForm">
    <h2>Log Launch / Test Run</h2>
    <div class="field">
      <label for="runLabel">Build / Session Label</label>
      <input id="runLabel" value="manual-pass" required>
    </div>
    <div class="field">
      <label for="runKind">Kind</label>
      <select id="runKind">
        <option value="test_pass">test_pass</option>
        <option value="launch">launch</option>
        <option value="manual">manual</option>
      </select>
    </div>
    <div class="field">
      <label for="runSummary">Summary</label>
      <textarea id="runSummary" rows="3" required placeholder="Summary of test results or observations"></textarea>
    </div>
    <div class="dlg-actions">
      <button type="button" class="btn" id="runCancel">Cancel</button>
      <button type="submit" class="btn primary">Save Run Log</button>
    </div>
  </form>
</dialog>

<script>
const THEME_KEY = "atlasUiTheme";
function applyTheme(raw) {
  const theme = raw === "dedsec" ? "dedsec" : "optik";
  if (theme === "dedsec") document.documentElement.setAttribute("data-theme", "dedsec");
  else document.documentElement.removeAttribute("data-theme");
  document.getElementById("themeBtn").textContent = theme === "dedsec" ? "DedSec Dark" : "Optik Dark";
}
applyTheme(localStorage.getItem(THEME_KEY));
window.addEventListener("storage", (e) => {
  if (e.key === THEME_KEY) applyTheme(e.newValue);
});
document.getElementById("themeBtn").addEventListener("click", () => {
  const next = localStorage.getItem(THEME_KEY) === "dedsec" ? "optik" : "dedsec";
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
});

const COLUMNS = ["queued", "testing", "passed", "failed"];
let suiteState = { counts: {}, features: [], runs: [] };

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function apiPost(payload) {
  const r = await fetch("/api/test-suite", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  const data = await r.json();
  if (!r.ok || !data.ok) throw new Error(data.error || "Request failed");
  return data;
}

async function loadSuite() {
  const statusEl = document.getElementById("statusLine");
  try {
    const r = await fetch("/api/test-suite?run_limit=40");
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.error || "Failed to load");
    suiteState = data;
    render();
    statusEl.textContent = `Updated ${new Date(data.updated_at || Date.now()).toLocaleTimeString()}`;
  } catch (err) {
    statusEl.textContent = `Error: ${err.message}`;
  }
}

function render() {
  const features = suiteState.features || [];
  const counts = suiteState.counts || {};
  let totalTicks = 0;
  let doneTicks = 0;
  for (const f of features) {
    for (const t of (f.ticks || [])) {
      totalTicks++;
      if (t.done) doneTicks++;
    }
  }
  document.getElementById("summaryPills").innerHTML = [
    `<span class="pill">Queued <b>${counts.queued || 0}</b></span>`,
    `<span class="pill warn">Testing <b>${counts.testing || 0}</b></span>`,
    `<span class="pill ok">Passed <b>${counts.passed || 0}</b></span>`,
    `<span class="pill bad">Needs Fix <b>${counts.failed || 0}</b></span>`,
    `<span class="pill cyan">Ticks <b>${doneTicks}/${totalTicks}</b></span>`,
  ].join("");

  for (const col of COLUMNS) {
    const list = features.filter((f) => (f.status || "queued") === col);
    document.getElementById(`count-${col}`).textContent = String(list.length);
    const body = document.getElementById(`col-${col}`);
    if (!list.length) {
      body.innerHTML = `<div class="empty-col">No features in ${esc(col === "failed" ? "Needs Fix" : col)}</div>`;
      continue;
    }
    body.innerHTML = list.map(renderCard).join("");
  }

  const runs = suiteState.runs || [];
  const runList = document.getElementById("runList");
  if (!runs.length) {
    runList.innerHTML = `<div class="empty-col">No launches or test runs logged yet.</div>`;
  } else {
    runList.innerHTML = runs.map((r) => {
      const ff = (r.feature_feedback || []).map((x) =>
        `<li>${esc(x.feature_id)}${x.status ? ` → ${esc(x.status)}` : ""}${x.note ? `: ${esc(x.note)}` : ""}</li>`
      ).join("");
      return `<article class="run-card">
        <div class="run-top">
          <b>${esc(r.label || "session")}</b>
          <span class="run-kind ${esc(r.kind || "")}">${esc(r.kind || "run")}</span>
        </div>
        <div class="run-summary">${esc(r.summary || "")}</div>
        <div class="run-time">${esc(r.at || "")}</div>
        ${ff ? `<ul class="run-ff">${ff}</ul>` : ""}
      </article>`;
    }).join("");
  }
}

function renderCard(f) {
  const ticks = Array.isArray(f.ticks) ? f.ticks : [];
  const fb = Array.isArray(f.feedback)
    ? f.feedback
    : (f.feedback ? [{ author: "model", at: "", note: String(f.feedback) }] : []);
  const doneCount = ticks.filter((t) => t.done).length;
  const ticksHtml = ticks.map((t) => `
    <label class="tick-item ${t.done ? "done" : ""}">
      <input type="checkbox" data-toggle-tick="${esc(t.id)}" data-fid="${esc(f.id)}" ${t.done ? "checked" : ""}>
      <span>${esc(t.label)}</span>
    </label>
  `).join("");
  const fbHtml = fb.length ? `<ul class="fb-list">${fb.slice().reverse().map((x) =>
    `<li><div class="fb-meta">${esc(x.author || "model")} · ${esc(x.at || "")}</div><div>${esc(x.note || "")}</div></li>`
  ).join("")}</ul>` : "";
  return `<article class="card" data-fid="${esc(f.id)}">
    <div class="card-top">
      <div>
        <h3 class="card-title">${esc(f.title)}</h3>
        <div class="card-id">${esc(f.id)} · ${doneCount}/${ticks.length} ticks</div>
      </div>
      <button type="button" class="btn sm danger" data-delete-fid="${esc(f.id)}" title="Delete feature">✕</button>
    </div>
    ${f.description ? `<p class="card-desc">${esc(f.description)}</p>` : ""}
    <div class="card-controls">
      <select class="status-select" data-status-fid="${esc(f.id)}" aria-label="Move column">
        <option value="queued" ${f.status === "queued" ? "selected" : ""}>Queued</option>
        <option value="testing" ${f.status === "testing" ? "selected" : ""}>Testing</option>
        <option value="passed" ${f.status === "passed" ? "selected" : ""}>Passed</option>
        <option value="failed" ${f.status === "failed" ? "selected" : ""}>Needs Fix</option>
      </select>
      <button type="button" class="btn sm" data-fb-fid="${esc(f.id)}">+ Feedback</button>
    </div>
    ${ticksHtml ? `<div class="ticks">${ticksHtml}</div>` : ""}
    <form class="inline-add" data-add-tick-fid="${esc(f.id)}">
      <input type="text" placeholder="+ Add tickbox…" aria-label="Add tickbox">
      <button type="submit" class="btn sm">Add</button>
    </form>
    <div class="fb-bar">
      <span class="fb-badge">Feedback: ${fb.length}</span>
    </div>
    ${fbHtml}
  </article>`;
}

const board = document.getElementById("board");
board.addEventListener("change", async (e) => {
  const tickCb = e.target.closest("input[data-toggle-tick]");
  if (tickCb) {
    await apiPost({ action: "update", feature_id: tickCb.dataset.fid, toggle_tick: tickCb.dataset.toggleTick });
    await loadSuite();
    return;
  }
  const sel = e.target.closest("select[data-status-fid]");
  if (sel) {
    await apiPost({ action: "update", feature_id: sel.dataset.statusFid, status: sel.value });
    await loadSuite();
  }
});

board.addEventListener("click", async (e) => {
  const del = e.target.closest("button[data-delete-fid]");
  if (del) {
    await apiPost({ action: "delete", feature_id: del.dataset.deleteFid });
    await loadSuite();
    return;
  }
  const fbBtn = e.target.closest("button[data-fb-fid]");
  if (fbBtn) {
    const note = prompt("Enter feedback note for this feature:");
    if (note && note.trim()) {
      await apiPost({ action: "update", feature_id: fbBtn.dataset.fbFid, feedback: note.trim(), author: "user" });
      await loadSuite();
    }
  }
});

board.addEventListener("submit", async (e) => {
  const form = e.target.closest("form[data-add-tick-fid]");
  if (!form) return;
  e.preventDefault();
  const input = form.querySelector("input");
  const label = (input.value || "").trim();
  if (!label) return;
  await apiPost({ action: "update", feature_id: form.dataset.addTickFid, add_tick: label });
  input.value = "";
  await loadSuite();
});

const drawer = document.getElementById("runDrawer");
const drawerToggleBtn = document.getElementById("drawerToggleBtn");
function toggleDrawer(open) {
  const show = open === undefined ? drawer.hidden : Boolean(open);
  drawer.hidden = !show;
  drawerToggleBtn.setAttribute("aria-expanded", String(show));
}
drawerToggleBtn.addEventListener("click", () => toggleDrawer());
document.getElementById("drawerCloseBtn").addEventListener("click", () => toggleDrawer(false));
document.getElementById("refreshBtn").addEventListener("click", loadSuite);

const addDlg = document.getElementById("addDlg");
document.getElementById("addFeatureBtn").addEventListener("click", () => addDlg.showModal());
document.getElementById("addCancel").addEventListener("click", () => addDlg.close());
document.getElementById("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const ticks = document.getElementById("featTicks").value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
  await apiPost({
    action: "add",
    title: document.getElementById("featTitle").value.trim(),
    description: document.getElementById("featDesc").value.trim(),
    status: document.getElementById("featStatus").value,
    ticks,
  });
  e.target.reset();
  addDlg.close();
  await loadSuite();
});

const runDlg = document.getElementById("runDlg");
document.getElementById("logRunBtn").addEventListener("click", () => runDlg.showModal());
document.getElementById("runCancel").addEventListener("click", () => runDlg.close());
document.getElementById("runForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  await apiPost({
    action: "log_run",
    label: document.getElementById("runLabel").value.trim(),
    kind: document.getElementById("runKind").value,
    summary: document.getElementById("runSummary").value.trim(),
  });
  document.getElementById("runSummary").value = "";
  runDlg.close();
  await loadSuite();
});

loadSuite();
</script>
</body>
</html>
